<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="t">
  <title id="t">Three happy students learning together on a laptop</title>
  <!-- Tusome illustration: students around a laptop, in the brand greens -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7f5e1"/>
      <stop offset="1" stop-color="#b0eac6"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22a45d"/>
      <stop offset="1" stop-color="#126c3d"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <circle cx="320" cy="250" r="232" fill="url(#glow)"/>
  <circle cx="520" cy="110" r="58" fill="#7dd8a3" opacity=".45"/>
  <circle cx="110" cy="410" r="40" fill="#7dd8a3" opacity=".35"/>
  <ellipse cx="320" cy="462" rx="250" ry="14" fill="#0f472b" opacity=".12"/>

  <!-- student in the middle, standing behind: glasses, thumbs up -->
  <g>
    <path d="M275 340 V262 a32 32 0 0 1 32 -32 h26 a32 32 0 0 1 32 32 V340 Z" fill="#126c3d"/>
    <path d="M308 230 L320 246 L332 230 Z" fill="#fff"/>
    <rect x="311" y="208" width="18" height="24" rx="6" fill="#6b4226"/>
    <circle cx="320" cy="188" r="30" fill="#6b4226"/>
    <circle cx="290" cy="190" r="6" fill="#6b4226"/>
    <circle cx="350" cy="190" r="6" fill="#6b4226"/>
    <path d="M290 184 C290 150 350 150 350 184 C344 170 334 166 320 166 C306 166 296 170 290 184 Z" fill="#160b05"/>
    <circle cx="310" cy="187" r="9" fill="none" stroke="#111827" stroke-width="2.5"/>
    <circle cx="330" cy="187" r="9" fill="none" stroke="#111827" stroke-width="2.5"/>
    <path d="M319 187 h2" stroke="#111827" stroke-width="2.5"/>
    <path d="M305 188 q5 -5 10 0 M325 188 q5 -5 10 0" fill="none" stroke="#2b1408" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M310 199 Q320 212 330 199 Z" fill="#3b120a"/>
    <circle cx="299" cy="198" r="4.5" fill="#f472b6" opacity=".3"/>
    <circle cx="341" cy="198" r="4.5" fill="#f472b6" opacity=".3"/>
  </g>

  <!-- student on the left: waving -->
  <g>
    <path d="M158 306 L120 248" stroke="#22a45d" stroke-width="24" stroke-linecap="round"/>
    <circle cx="116" cy="240" r="13" fill="#8d5a3b"/>
    <path d="M96 222 q-6 8 -2 16 M90 232 q-4 6 0 12" fill="none" stroke="#15874a" stroke-width="3" stroke-linecap="round"/>
    <path d="M150 366 V330 a40 40 0 0 1 40 -40 h40 a40 40 0 0 1 40 40 V366 Z" fill="#22a45d"/>
    <path d="M196 290 L210 308 L224 290 Z" fill="#fff"/>
    <rect x="200" y="268" width="20" height="26" rx="7" fill="#8d5a3b"/>
    <circle cx="210" cy="245" r="34" fill="#8d5a3b"/>
    <circle cx="176" cy="248" r="7" fill="#8d5a3b"/>
    <circle cx="244" cy="248" r="7" fill="#8d5a3b"/>
    <path d="M177 240 C175 202 245 202 243 240 C236 226 222 221 210 221 C198 221 184 226 177 240 Z" fill="#1c0f08"/>
    <path d="M195 243 q6 -7 12 0 M213 243 q6 -7 12 0" fill="none" stroke="#2b1408" stroke-width="3" stroke-linecap="round"/>
    <path d="M198 256 Q210 272 222 256 Z" fill="#3b120a"/>
    <path d="M203 259 Q210 266 217 259" fill="#f87171" opacity=".8"/>
    <circle cx="189" cy="254" r="5" fill="#f472b6" opacity=".3"/>
    <circle cx="231" cy="254" r="5" fill="#f472b6" opacity=".3"/>
  </g>

  <!-- student on the right: afro puffs, typing -->
  <g>
    <path d="M384 320 L362 352" stroke="#15874a" stroke-width="22" stroke-linecap="round"/>
    <path d="M370 366 V330 a40 40 0 0 1 40 -40 h40 a40 40 0 0 1 40 40 V366 Z" fill="#15874a"/>
    <path d="M416 290 L430 308 L444 290 Z" fill="#fff"/>
    <rect x="420" y="268" width="20" height="26" rx="7" fill="#a86b4a"/>
    <circle cx="396" cy="214" r="20" fill="#160b05"/>
    <circle cx="464" cy="214" r="20" fill="#160b05"/>
    <circle cx="430" cy="245" r="34" fill="#a86b4a"/>
    <circle cx="396" cy="248" r="7" fill="#a86b4a"/>
    <circle cx="464" cy="248" r="7" fill="#a86b4a"/>
    <path d="M397 240 C395 204 465 204 463 240 C455 228 442 223 430 223 C418 223 405 228 397 240 Z" fill="#160b05"/>
    <circle cx="396" cy="232" r="3.5" fill="#fbbf24"/>
    <path d="M415 243 q6 -7 12 0 M433 243 q6 -7 12 0" fill="none" stroke="#2b1408" stroke-width="3" stroke-linecap="round"/>
    <path d="M418 256 Q430 272 442 256 Z" fill="#3b120a"/>
    <path d="M423 259 Q430 266 437 259" fill="#f87171" opacity=".8"/>
    <circle cx="409" cy="254" r="5" fill="#f472b6" opacity=".3"/>
    <circle cx="451" cy="254" r="5" fill="#f472b6" opacity=".3"/>
  </g>

  <!-- the middle student's thumbs up, in front -->
  <path d="M358 250 L378 176" stroke="#126c3d" stroke-width="20" stroke-linecap="round"/>
  <circle cx="379" cy="168" r="12" fill="#6b4226"/>
  <rect x="374" y="146" width="8" height="18" rx="4" fill="#6b4226"/>

  <!-- the laptop, from behind: the Tusome mark on its lid -->
  <rect x="250" y="262" width="140" height="96" rx="10" fill="url(#lid)"/>
  <rect x="256" y="268" width="128" height="84" rx="7" fill="#fff" opacity=".08"/>
  <circle cx="320" cy="310" r="17" fill="#fff" opacity=".95"/>
  <text x="320" y="317" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="20" fill="#15874a">T</text>
  <circle cx="331" cy="301" r="3" fill="#22a45d"/>
  <path d="M232 358 h176 l10 8 h-196 Z" fill="#0f472b"/>

  <!-- the desk, a plant and some books -->
  <rect x="80" y="364" width="480" height="16" rx="6" fill="#126c3d"/>
  <rect x="112" y="378" width="12" height="80" rx="4" fill="#0f472b"/>
  <rect x="516" y="378" width="12" height="80" rx="4" fill="#0f472b"/>
  <path d="M100 364 l5 -30 h28 l5 30 Z" fill="#0f472b"/>
  <ellipse cx="108" cy="318" rx="9" ry="20" fill="#46bf7b" transform="rotate(-25 108 318)"/>
  <ellipse cx="130" cy="314" rx="9" ry="22" fill="#22a45d" transform="rotate(20 130 314)"/>
  <ellipse cx="119" cy="306" rx="8" ry="24" fill="#7dd8a3"/>
  <rect x="478" y="350" width="64" height="14" rx="3" fill="#15874a"/>
  <rect x="484" y="338" width="54" height="12" rx="3" fill="#fbbf24"/>
  <rect x="480" y="326" width="58" height="12" rx="3" fill="#fff"/>
  <rect x="486" y="330" width="40" height="3" rx="1.5" fill="#b0eac6"/>

  <!-- what learning feels like: a "well done" bubble, a star, a light bulb, an A+ -->
  <g>
    <rect x="52" y="118" width="104" height="58" rx="16" fill="#fff"/>
    <path d="M118 176 l14 16 l2 -16 Z" fill="#fff"/>
    <circle cx="80" cy="147" r="13" fill="#22a45d"/>
    <path d="M74 147 l4 4 l8 -8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="100" y="138" width="42" height="6" rx="3" fill="#b0eac6"/>
    <rect x="100" y="150" width="30" height="6" rx="3" fill="#d7f5e1"/>
  </g>
  <path d="M520 92 l9 19 l21 3 l-15 15 l4 21 l-19 -10 l-19 10 l4 -21 l-15 -15 l21 -3 Z" fill="#fbbf24"/>
  <g>
    <circle cx="572" cy="234" r="20" fill="#fde68a"/>
    <path d="M562 232 a10 10 0 1 1 20 0 c0 6 -5 8 -5 13 h-10 c0 -5 -5 -7 -5 -13 Z" fill="#fbbf24"/>
    <rect x="567" y="247" width="10" height="5" rx="2" fill="#a16207"/>
    <path d="M572 202 v-8 M598 214 l6 -5 M546 214 l-6 -5" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g>
    <circle cx="598" cy="300" r="24" fill="#effbf3" stroke="#7dd8a3" stroke-width="3"/>
    <text x="598" y="308" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="20" fill="#15874a">A+</text>
  </g>
  <path d="M232 132 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z" fill="#fff"/>
  <path d="M430 150 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z" fill="#fff"/>
  <path d="M170 92 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#22a45d"/>
</svg>
