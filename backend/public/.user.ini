; Many shared-hosting PHP defaults cap upload_max_filesize/post_max_size well below what this app
; actually needs (teacher videos allow up to 300MB) - a request over the ini limit gets
; silently dropped by PHP itself before our own validation code ever runs, emptying $_FILES
; with no useful error. Only takes effect under PHP-FPM/CGI/suPHP/LiteSpeed (the SAPIs that read
; .user.ini) - if this host instead runs mod_php, set these via cPanel's MultiPHP INI Editor.
upload_max_filesize = 310M
post_max_size = 320M
memory_limit = 256M
max_execution_time = 600
max_input_time = 600
