; Many shared-hosting PHP defaults cap upload_max_filesize/post_max_size well below what this app
; actually needs (ENoteImageController allows up to 15MB) - a request over the ini limit gets
; silently truncated by PHP itself before our own validation code ever runs, emptying $_FILES
; entirely with no per-file error code to explain why. Since large phone-camera JPEGs are
; typically the biggest files teachers upload, this surfaces as "some formats don't work" even
; though the real cause is request size, not file type. Only takes effect under PHP-FPM/CGI/suPHP
; (the SAPIs that read .user.ini) - if this host instead runs mod_php, these values need setting
; via cPanel's MultiPHP INI Editor instead.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 120
